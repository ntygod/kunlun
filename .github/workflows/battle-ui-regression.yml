name: Battle UI regression
on:
  pull_request:
    paths:
      - '.github/workflows/battle-ui-regression.yml'
      - 'game/scripts/ui/battle_panel.gd'
      - 'game/tests/test_battle_panel*.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battle-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the project-pinned Godot version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kunlun-godot"
          cd "$RUNNER_TEMP/kunlun-godot"
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          archive=Godot_v4.6.3-stable_linux.x86_64.zip
          curl --fail --location --retry 3 "$release/$archive" -o "$archive"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          # Require exactly one checksum entry for this archive; fail closed.
          awk -v name="$archive" '$2 == name || $2 == "*" name' SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum --check selected.sha512
          unzip -q "$archive"
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and run targeted regressions with isolated saves
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          godot = os.environ["GODOT"]
          steps = [
              ("import", [godot, "--headless", "--path", "game", "--editor", "--import", "--quit"]),
              ("battle-panel-existing", [godot, "--headless", "--path", "game", "--script", "res://tests/test_battle_panel.gd"]),
              ("battle-panel-usability", [godot, "--headless", "--path", "game", "--script", "res://tests/test_battle_panel_usability.gd"]),
              ("combat", [godot, "--headless", "--path", "game", "--script", "res://tests/test_combat.gd"]),
              ("startup", [godot, "--headless", "--path", "game", "--quit-after", "120"]),
          ]
          diagnostics = re.compile(r"(?m)^\s*(?:SCRIPT ERROR|ERROR|WARNING):")
          with tempfile.TemporaryDirectory(prefix="kunlun-ui-") as temporary:
              for name, command in steps:
                  env = dict(os.environ)
                  for variable, directory in [("XDG_DATA_HOME", "data"), ("XDG_CACHE_HOME", "cache"), ("XDG_CONFIG_HOME", "config")]:
                      path = pathlib.Path(temporary) / name / directory
                      path.mkdir(parents=True)
                      env[variable] = str(path)
                  print(f"::group::{name}", flush=True)
                  result = subprocess.run(command, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
                  print(result.stdout, flush=True)
                  print("::endgroup::", flush=True)
                  if result.returncode or diagnostics.search(result.stdout):
                      raise SystemExit(f"{name} failed: exit={result.returncode}; inspect diagnostics above")
          print("Targeted checks passed. This is not native GUI or full-campaign acceptance.")
          PY
