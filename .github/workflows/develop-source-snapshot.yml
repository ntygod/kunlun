name: Develop source snapshot
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/develop-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked history only
        run: |
          mkdir -p "$RUNNER_TEMP/kunlun-source"
          git bundle create "$RUNNER_TEMP/kunlun-source/repository.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/kunlun-source/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/kunlun-source/tree.txt"
          cd "$RUNNER_TEMP/kunlun-source"
          sha256sum repository.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kunlun-develop-source-${{ github.sha }}
          path: ${{ runner.temp }}/kunlun-source/
          retention-days: 1
          if-no-files-found: error
