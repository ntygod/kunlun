name: Verify and publish chapter seventeen once
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/publish-chapter-seventeen-once.yml']
permissions:
  contents: write
concurrency:
  group: publish-chapter-seventeen
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify the reviewed candidate
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kunlun-ch17-publication'
          work.mkdir()
          base = '00995d57b968744fea6c7b412e7d6b0fea5de334'
          def git(*args, env=None):
              return subprocess.check_output(['git', *args], env=env)
          paths = git('ls-tree', '-r', '--name-only', base).decode().splitlines()
          paths = [p for p in paths if p.endswith(('.gd', '.py', '.json', '.yml')) and (p.startswith('game/') or p.startswith('tools/content/'))]
          dictionary = b''.join(git('show', base + ':' + p) for p in paths)
          assert hashlib.sha256(dictionary).hexdigest() == '883b9310a55117f20aac9de652af1f7e98e752cef7d49827f745cf37cf79c89a'
          (work / 'dictionary.bin').write_bytes(dictionary)
          delta = b''.join((root / '.github/integration/ch17' / name).read_bytes() for name in ['part-0','part-1-0','part-1-1','part-1-2','part-2-0','part-2-1','part-2-2','part-3-0','part-3-1','part-3-2'])
          assert len(delta) == 35254
          assert hashlib.sha256(delta).hexdigest() == '4b789997c26ec6e9f3ac4b20f3c49e250f98e418f6705feae0abc4f0f0b9d179'
          (work / 'candidate.zst').write_bytes(delta)
          subprocess.run(['zstd', '-q', '-d', '--patch-from=' + str(work/'dictionary.bin'), str(work/'candidate.zst'), '-o', str(work/'candidate.patch')], check=True)
          assert hashlib.sha256((work/'candidate.patch').read_bytes()).hexdigest() == 'f40b2dea2599647b8463a101781e3d028621c2e57a4e4f0c18c483f9aa5f09d8'
          subprocess.run(['git', 'apply', '--index', '--binary', str(work/'candidate.patch')], check=True)
          subprocess.run(['python3', 'tools/content/build_chapter_seventeen.py'], check=True)
          subprocess.run(['git', 'add', 'game/data/chapter_seventeen.json', 'game/data/chapter_seventeen_runtime.json', 'game/data/maps/chapter_seventeen_maps.json'], check=True)
          subprocess.run(['git', 'rm', '-rf', '.github/integration/ch17'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          # Validate the complete candidate excluding this unchanged transport workflow.
          # The contents-only Actions token never creates, modifies or deletes workflow files.
          index = work/'candidate.index'
          shutil.copyfile(git('rev-parse', '--git-path', 'index').decode().strip(), index)
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          subprocess.run(['git', 'update-index', '--force-remove', '.github/workflows/publish-chapter-seventeen-once.yml'], env=env, check=True)
          tree = git('write-tree', env=env).decode().strip()
          assert tree == '52d2269e40ed4576ff6ca060205e153201bdba05', tree
          print('Reviewed candidate tree:', tree)
          PY
      - name: Install checksum-verified Godot 4.6.3
        run: bash game/tools/ui/install_godot.sh
      - name: Check model routes, saves and native layouts
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri libegl1
          fi
          python3 game/tools/develop/run_checks.py --godot "$GODOT" --output "$RUNNER_TEMP/kunlun-ch17-publication/evidence" --native
      - name: Publish tested source to develop only without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, shutil, subprocess
          work = pathlib.Path(os.environ['RUNNER_TEMP'])/'kunlun-ch17-publication'
          evidence = work/'evidence'
          def git(*args, env=None):
              return subprocess.check_output(['git', *args], env=env, text=True).strip()
          runs = json.loads((evidence/'summary.json').read_text())['runs']
          assert len(runs) == 38 and all(r['status'] == 'passed' for r in runs)
          assert len(list((evidence/'screenshots/chapter16').glob('*.png'))) == 16
          assert len(list((evidence/'screenshots/chapter17').glob('*.png'))) == 18
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          index = work/'candidate.index'
          shutil.copyfile(git('rev-parse', '--git-path', 'index'), index)
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          subprocess.run(['git', 'update-index', '--force-remove', '.github/workflows/publish-chapter-seventeen-once.yml'], env=env, check=True)
          tree = git('write-tree', env=env)
          assert tree == '52d2269e40ed4576ff6ca060205e153201bdba05'
          workflow_changes = git('diff', '--cached', '--name-only', '--', '.github/workflows/')
          assert workflow_changes == '', 'Actions token must not write workflows'
          heads = {row.split()[1].removeprefix('refs/heads/'):row.split()[0] for row in git('ls-remote', '--heads', 'origin').splitlines()}
          assert heads == {'main':'7298b2d89c50a45009f8dd1665b12597712e034c', 'develop':os.environ['GITHUB_SHA']}, 'remote changed; stop rather than overwrite'
          subprocess.run(['git', 'config', 'user.name', 'Kunlun Development'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: continue Tianshan campaign through chapter seventeen', '-m', 'Preserve two-branch history and unchanged main. Add six-evidence deduction, resumable R07 construction, B13 double and Amo phases, limited Feng Lian, canonical gear, strict bounded terminal summaries and nine independent-process save cases. Model and native checks passed; natural full-chapter GUI and final art/audio are not accepted.'], check=True)
          sha = git('rev-parse', 'HEAD')
          assert git('rev-parse', 'HEAD^') == os.environ['GITHUB_SHA']
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          push_env = dict(os.environ, GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/develop'], env=push_env, check=True)
          assert git('ls-remote', '--heads', 'origin', 'develop').split()[0] == sha
          (evidence/'publication.json').write_text(json.dumps({'commit':sha,'parent':os.environ['GITHUB_SHA'],'tree':git('rev-parse','HEAD^{tree}'),'reviewed_candidate_tree':tree,'branch':'develop','main_unchanged':heads['main'],'executions':38,'scope':'model and native render; not natural full chapter GUI'},indent=2)+'\n')
          print('Published verified candidate', sha)
          PY
      - name: Preserve actual evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kunlun-ch17-publication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kunlun-ch17-publication/evidence/logs/
            ${{ runner.temp }}/kunlun-ch17-publication/evidence/*.json
            ${{ runner.temp }}/kunlun-ch17-publication/evidence/screenshots/
          retention-days: 30
          if-no-files-found: error
